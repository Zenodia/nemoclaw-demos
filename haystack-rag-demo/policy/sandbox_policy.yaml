version: 1
network_policies:
  claude_code:
    name: claude_code
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        access: full
      - host: statsig.anthropic.com
        port: 443
      - host: sentry.io
        port: 443
      - host: raw.githubusercontent.com
        port: 443
      - host: platform.claude.com
        port: 443
    binaries:
      - path: /usr/local/bin/claude
      - path: /usr/bin/node
  haystack_rag_host:
    # Allows the sandbox skill (haystack_client.py) to reach the Haystack RAG
    # server running on the host at port __RAG_PORT__. NVIDIA_API_KEY never
    # enters the sandbox — all inference happens on the host side of this
    # connection. __HOST_IP__ is rendered to the host's real, non-loopback IP
    # by install.sh. Do NOT use host.openshell.internal here.
    name: haystack_rag_host
    endpoints:
      - host: __HOST_IP__
        port: __RAG_PORT__
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,  path: "/health" }
          - allow: { method: POST, path: "/setup" }
          - allow: { method: POST, path: "/index" }
          - allow: { method: POST, path: "/query" }
          - allow: { method: GET,  path: "/documents" }
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }
      - { path: /usr/bin/curl }
      - { path: /usr/bin/python3 }
      - { path: /usr/bin/python3.11 }
      - { path: /sandbox/.venv/bin/python }
      - { path: /sandbox/.venv/bin/python3 }
      - { path: "/sandbox/.uv/python/**" }
      - { path: "/sandbox/.openclaw/workspace/skills/*/venv/bin/python" }
      - { path: "/sandbox/.openclaw/workspace/skills/*/venv/bin/python3" }
      - { path: "/sandbox/.openclaw/workspace/skills/*/venv/bin/python3.11" }
      - { path: "/sandbox/.openclaw/workspace/skills/*/venv/bin/python3.12" }
      - { path: "/sandbox/.openclaw-data/workspace/skills/*/venv/bin/python" }
      - { path: "/sandbox/.openclaw-data/workspace/skills/*/venv/bin/python3" }
      - { path: "/sandbox/.openclaw-data/workspace/skills/*/venv/bin/python3.11" }
      - { path: "/sandbox/.openclaw-data/workspace/skills/*/venv/bin/python3.12" }
  nvidia:
    name: nvidia
    endpoints:
      - { host: integrate.api.nvidia.com, port: 443 }
    binaries:
      - { path: /usr/bin/curl }
      - { path: /bin/bash }
      - { path: /usr/local/bin/opencode }
  nvidia_web:
    name: nvidia_web
    endpoints:
      - { host: nvidia.com, port: 443 }
      - { host: www.nvidia.com, port: 443 }
    binaries:
      - { path: /usr/bin/curl }
  github:
    name: github
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: "/**/info/refs*"
          - allow:
              method: POST
              path: "/**/git-upload-pack"
    binaries:
      - { path: /usr/bin/git }
  github_rest_api:
    name: github-rest-api
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: "/**"
          - allow:
              method: HEAD
              path: "/**"
          - allow:
              method: OPTIONS
              path: "/**"
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: /usr/bin/gh }
  pypi:
    name: pypi
    endpoints:
      - { host: pypi.org, port: 443 }
      - { host: files.pythonhosted.org, port: 443 }
      - { host: github.com, port: 443 }
      - { host: objects.githubusercontent.com, port: 443 }
      - { host: api.github.com, port: 443 }
      - { host: downloads.python.org, port: 443 }
    binaries:
      - { path: /usr/bin/python3 }
      - { path: /usr/bin/python3.11 }
      - { path: /sandbox/.venv/bin/python }
      - { path: /sandbox/.venv/bin/python3 }
      - { path: /sandbox/.venv/bin/pip }
      - { path: /app/.venv/bin/python }
      - { path: /app/.venv/bin/python3 }
      - { path: /app/.venv/bin/pip }
      - { path: /usr/local/bin/uv }
      - { path: "/sandbox/.uv/python/**" }
      - { path: "/sandbox/.openclaw/workspace/skills/*/venv/bin/python" }
      - { path: "/sandbox/.openclaw/workspace/skills/*/venv/bin/python3" }
      - { path: "/sandbox/.openclaw/workspace/skills/*/venv/bin/python3.11" }
      - { path: "/sandbox/.openclaw/workspace/skills/*/venv/bin/python3.12" }
      - { path: "/sandbox/.openclaw/workspace/skills/*/venv/bin/pip" }
      - { path: "/sandbox/.openclaw-data/workspace/skills/*/venv/bin/python" }
      - { path: "/sandbox/.openclaw-data/workspace/skills/*/venv/bin/python3" }
      - { path: "/sandbox/.openclaw-data/workspace/skills/*/venv/bin/python3.11" }
      - { path: "/sandbox/.openclaw-data/workspace/skills/*/venv/bin/python3.12" }
      - { path: "/sandbox/.openclaw-data/workspace/skills/*/venv/bin/pip" }
